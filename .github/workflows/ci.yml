name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verificar aplicação
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Preparar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar lint
        run: npm run lint

      - name: Verificar tipos
        run: npm run typecheck

      - name: Executar testes unitários e de integração
        run: npm test

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Executar testes de interface
        run: npm run test:e2e -- --workers=1

      - name: Gerar build de produção
        run: npm run build
